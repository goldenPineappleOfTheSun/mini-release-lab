name: Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "SHA коммита с готовым Docker-образом"
        required: true
        type: string
      release_tag:
        description: "Версия релиза, например v1.0.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release started
        run: echo "Release workflow started"
      - name: Show release inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "Source: $SOURCE_SHA"
          echo "Version: $RELEASE_TAG"
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image reference
        id: image
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/$OWNER/mini-release-lab"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "source=$IMAGE:sha-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "target=$IMAGE:release-$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Inspect source image
        env:
          SOURCE: ${{ steps.image.outputs.source }}
        run: docker buildx imagetools inspect "$SOURCE"
      - name: Check release tag
        env:
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          if docker buildx imagetools inspect "$TARGET" >/dev/null 2>&1; then
            echo "Release tag already exists: $TARGET"
            exit 1
          fi
          echo "Release tag not found: $TARGET"
      - name: Promote image
        env:
          SOURCE: ${{ steps.image.outputs.source }}
          TARGET: ${{ steps.image.outputs.target }}
        run: |
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$TARGET" \
            "$SOURCE"