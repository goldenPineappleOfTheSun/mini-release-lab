name: Hello CI

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "Hello from GitHub Actions"
      - name: Show GitHub info
        run: |
          echo "SHA: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Actor: $GITHUB_ACTOR"
      - name: Compare values
        env:
          MY_COMMIT: ${{ github.sha }}
        run: |
          echo "From GitHub: $GITHUB_SHA"
          echo "From custom env: $MY_COMMIT"
      - name: Set environment
        run: echo "BUILD_AREA=training" >> "$GITHUB_ENV"
      - name: Read environment
        run: echo "Area is $BUILD_AREA"