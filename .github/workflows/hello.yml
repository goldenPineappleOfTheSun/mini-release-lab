name: Hello CI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image name
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/$OWNER/mini-release-lab" >> "$GITHUB_OUTPUT"
      - name: Show image name
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: echo "$IMAGE"
      - name: Push Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker push "$IMAGE:sha-$GITHUB_SHA"
      - name: Build Docker image
        env:
          COMMIT: ${{ github.sha }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker build --build-arg "COMMIT=$COMMIT" -t "$IMAGE:sha-$COMMIT" .
      - name: Verify commit label
        env:
          COMMIT: ${{ github.sha }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker image inspect "$IMAGE:sha-$COMMIT" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'